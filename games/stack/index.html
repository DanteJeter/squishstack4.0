<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Squish Stack</title><link rel="stylesheet" href="../../assets/style.css"><link rel="stylesheet" href="stack.css"></head>
<body class="game-page"><header class="game-head"><a class="back" href="../../">← Arcade</a><div class="game-title">SQUISH STACK</div><span style="width:74px"></span></header>
<main class="game-shell"><div class="hud"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>BEST</small><strong id="best">0</strong></div><div class="stat"><small>LEVEL</small><strong id="level">1</strong></div></div>
<div class="game-area" id="stackArea"><canvas id="stackCanvas"></canvas><div class="stack-tip" id="tip">TAP TO DROP</div>
<div class="overlay" id="start"><div class="panel"><h1>Squish<br>Stack</h1><p>Tap to drop each moving Squish. Center it for bonus points. Miss the tower and the run is over.</p><button class="primary" id="startBtn">START STACKING</button></div></div>
<div class="overlay hidden" id="over"><div class="panel"><h1>Squished!</h1><p id="final"></p><button class="primary" id="again">PLAY AGAIN</button></div></div>
</div></main><script src="stack.js"></script></body></html>
